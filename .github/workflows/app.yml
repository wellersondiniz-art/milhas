name: app

# Confere que o app Android e iOS (Capacitor) ainda compila. Não assina nada
# e não usa segredo nenhum. O APK de teste (debug) fica como artefato da
# execução por 14 dias: dá para instalar num Android para experimentar.
# Publicar nas lojas é outro workflow (app-publicar.yml), só manual.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'site/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK de teste)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Instalar ferramentas (Capacitor e Playwright, só desenvolvimento)
        run: npm ci --no-audit --no-fund
      - name: Montar o app (site + app/www + cap sync)
        run: npm run app:montar
      - name: Compilar o APK de teste
        working-directory: app/android
        run: |
          # O Capacitor 8 pede Java 21 (já vem instalado no runner).
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milhas-da-vez-teste-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS (simulador)
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Instalar ferramentas (Capacitor e Playwright, só desenvolvimento)
        run: npm ci --no-audit --no-fund
      - name: Montar o app (site + app/www + cap sync)
        run: npm run app:montar
      - name: Compilar para o simulador (sem assinatura)
        run: |
          xcodebuild -version
          xcodebuild -project app/ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
