<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Fone de ouvido (página de exemplo)</title>
</head>
<body>
  <!-- Preço em atributo de máquina (ponto decimal), como em muitas lojas. -->
  <h1>Fone de ouvido sem fio (exemplo)</h1>
  <div class="preco-principal">
    <meta itemprop="price" content="250.00">
    <span aria-hidden="true">R$ 250<sup>00</sup></span>
  </div>
  <script>document.body.dataset.paginaOk = 'sim';</script>
</body>
</html>
